<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="820" height="420" fill="#0B1F3A"/>

  <!-- title -->
  <text x="410" y="34" fill="#E5EDF7" font-size="18" font-weight="700" text-anchor="middle">Eclipse geometry: cylindrical-shadow model</text>

  <!-- Sun rays -->
  <g stroke="#F59E0B" stroke-width="2">
    <line x1="20" y1="120" x2="150" y2="120"/>
    <line x1="20" y1="170" x2="150" y2="170"/>
    <line x1="20" y1="220" x2="150" y2="220"/>
    <line x1="20" y1="270" x2="150" y2="270"/>
    <line x1="20" y1="320" x2="150" y2="320"/>
  </g>
  <text x="30" y="360" fill="#F59E0B" font-size="13" font-weight="600">Sunlight</text>
  <polygon points="150,116 162,120 150,124" fill="#F59E0B"/>
  <polygon points="150,216 162,220 150,224" fill="#F59E0B"/>
  <polygon points="150,316 162,320 150,324" fill="#F59E0B"/>

  <!-- Earth -->
  <circle cx="300" cy="220" r="80" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2"/>
  <text x="300" y="225" fill="#E5EDF7" font-size="15" font-weight="600" text-anchor="middle">Earth</text>

  <!-- Shadow cylinder -->
  <rect x="300" y="140" width="440" height="160" fill="#050C18" opacity="0.85"/>
  <line x1="300" y1="140" x2="740" y2="140" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="300" y1="300" x2="740" y2="300" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="560" y="215" fill="#EF4444" font-size="14" font-weight="700" text-anchor="middle">Earth's shadow</text>
  <text x="560" y="235" fill="#94A3B8" font-size="11" text-anchor="middle">(eclipse zone)</text>

  <!-- Orbit ellipse -->
  <ellipse cx="300" cy="220" rx="180" ry="120" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
  <text x="300" y="80" fill="#38BDF8" font-size="13" font-weight="600" text-anchor="middle">Circular orbit</text>

  <!-- Satellite in sun -->
  <circle cx="180" cy="150" r="7" fill="#22C55E"/>
  <text x="150" y="135" fill="#22C55E" font-size="11" font-weight="600">compute ON</text>
  <text x="150" y="122" fill="#22C55E" font-size="10">(solar)</text>

  <!-- Satellite in eclipse -->
  <circle cx="440" cy="285" r="7" fill="#EF4444"/>
  <text x="452" y="290" fill="#EF4444" font-size="11" font-weight="600">on battery</text>

  <!-- Half-angle marker -->
  <text x="300" y="378" fill="#E5EDF7" font-size="12" text-anchor="middle">Eclipse fraction  f&#8323;  =  (1/&#960;) &#183; arccos[ &#8730;(h&#178; + 2Rh) / ((R+h)&#183;cos&#946;) ]</text>
</svg>
