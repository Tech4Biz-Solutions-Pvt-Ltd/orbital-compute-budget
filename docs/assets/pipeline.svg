<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="860" height="340" fill="#0B1F3A"/>
  <text x="430" y="34" fill="#E5EDF7" font-size="18" font-weight="700" text-anchor="middle">How orbital-compute-budget computes the answer</text>

  <!-- Inputs box -->
  <rect x="30" y="70" width="180" height="210" rx="8" fill="#0F2647" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="120" y="96" fill="#3B82F6" font-size="13" font-weight="700" text-anchor="middle">INPUTS</text>
  <text x="48" y="124" fill="#E5EDF7" font-size="12" font-weight="600">Orbit</text>
  <text x="48" y="142" fill="#94A3B8" font-size="11">altitude, inclination, RAAN</text>
  <text x="48" y="176" fill="#E5EDF7" font-size="12" font-weight="600">Power system</text>
  <text x="48" y="194" fill="#94A3B8" font-size="11">compute load (W)</text>
  <text x="48" y="210" fill="#94A3B8" font-size="11">solar array (W)</text>
  <text x="48" y="226" fill="#94A3B8" font-size="11">battery (Wh), DoD</text>
  <text x="48" y="258" fill="#F59E0B" font-size="10.5" font-weight="600">tunable assumptions</text>

  <!-- arrow -->
  <line x1="210" y1="175" x2="250" y2="175" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="250,170 262,175 250,180" fill="#38BDF8"/>

  <!-- Physics box -->
  <rect x="262" y="70" width="200" height="210" rx="8" fill="#0F2647" stroke="#38BDF8" stroke-width="1.6"/>
  <text x="362" y="96" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">EXACT PHYSICS</text>
  <text x="280" y="126" fill="#E5EDF7" font-size="12">&#8226; Orbital period (Kepler)</text>
  <text x="280" y="150" fill="#E5EDF7" font-size="12">&#8226; Beta angle</text>
  <text x="280" y="174" fill="#E5EDF7" font-size="12">&#8226; Critical beta</text>
  <text x="280" y="198" fill="#E5EDF7" font-size="12">&#8226; Eclipse fraction</text>
  <text x="280" y="234" fill="#22C55E" font-size="10.5" font-weight="600">validated vs published</text>
  <text x="280" y="250" fill="#22C55E" font-size="10.5" font-weight="600">benchmarks (16 tests)</text>

  <!-- arrow -->
  <line x1="462" y1="175" x2="502" y2="175" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="502,170 514,175 502,180" fill="#38BDF8"/>

  <!-- Energy balance box -->
  <rect x="514" y="70" width="200" height="210" rx="8" fill="#0F2647" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="614" y="96" fill="#3B82F6" font-size="13" font-weight="700" text-anchor="middle">ENERGY BALANCE</text>
  <text x="532" y="126" fill="#E5EDF7" font-size="12">Sun: compute + charge</text>
  <text x="532" y="150" fill="#E5EDF7" font-size="12">Eclipse: battery carries</text>
  <text x="532" y="174" fill="#E5EDF7" font-size="12">Feasibility check</text>
  <text x="532" y="198" fill="#E5EDF7" font-size="12">Recharge headroom</text>
  <text x="532" y="234" fill="#F59E0B" font-size="10.5" font-weight="600">flags infeasible</text>
  <text x="532" y="250" fill="#F59E0B" font-size="10.5" font-weight="600">configurations</text>

  <!-- arrow -->
  <line x1="714" y1="175" x2="754" y2="175" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="754,170 766,175 754,180" fill="#38BDF8"/>

  <!-- Output -->
  <rect x="766" y="120" width="80" height="110" rx="8" fill="#132F1C" stroke="#22C55E" stroke-width="1.8"/>
  <text x="806" y="150" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">OUTPUT</text>
  <text x="806" y="176" fill="#E5EDF7" font-size="11" text-anchor="middle">effective</text>
  <text x="806" y="192" fill="#E5EDF7" font-size="11" text-anchor="middle">compute-</text>
  <text x="806" y="208" fill="#E5EDF7" font-size="11" text-anchor="middle">hours/day</text>

  <text x="430" y="316" fill="#94A3B8" font-size="11.5" text-anchor="middle">Exact physics stays separate from tunable engineering assumptions. That separation is what makes the result defensible.</text>
</svg>
